<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MICHISHIRUBE — 道しるべ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { font-family: 'Noto Sans JP','Hiragino Kaku Gothic Pro',sans-serif; background:#faf8f4; -webkit-text-size-adjust:100%; }
    @keyframes glow { 0%,80%,100%{opacity:0.3;transform:scale(1)} 40%{opacity:1;transform:scale(1.3)} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin { to{transform:rotate(360deg)} }
    ::-webkit-scrollbar{width:3px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:#d4c9b0;border-radius:2px}
    textarea,input{-webkit-appearance:none;appearance:none}
    textarea::placeholder,input::placeholder{color:#b0a090}
    button{-webkit-tap-highlight-color:transparent}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

// ▼▼▼ GASウェブアプリのURLをここに貼り付ける ▼▼▼
const GAS_URL = "https://script.google.com/macros/s/AKfycby2FPLY481IPvk2BNhc0iJcAlvn7PDt4bX9VGOJHuNQwyMLeoBj3_HvJQRtbtacaqFAxQ/exec";
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

const T = {
  bg:"#faf8f4", surface:"#ffffff", surfaceHi:"#f5f0e8",
  border:"#e0d5c0", borderSub:"#ede6d6",
  gold:"#b8943f", goldDim:"#8a6f2e",
  goldGlow:"rgba(184,148,63,0.10)", goldGlowS:"rgba(184,148,63,0.06)",
  text:"#1a1714", textSub:"#5a4f3e", textMuted:"#9a8a75",
};

const CATEGORIES = [
  { id:"acquisition", label:"集客", icon:"集", sub:[
    { id:"visitor_low",   label:"来場数が伸びない" },
    { id:"media_effect",  label:"媒体効果がわからない" },
    { id:"area_strategy", label:"商圏・エリア戦略を見直したい" },
    { id:"event",         label:"イベント・催事の企画" },
  ]},
  { id:"conversion", label:"成約", icon:"約", sub:[
    { id:"closing_low", label:"契約率が上がらない" },
    { id:"revisit",     label:"再商談が取れない" },
    { id:"pricing",     label:"価格・値引き判断に迷っている" },
    { id:"objection",   label:"競合に負けるケースが多い" },
  ]},
  { id:"positioning", label:"競合・ポジショニング", icon:"戦", sub:[
    { id:"competitive_map",  label:"競合との比較整理" },
    { id:"usp",              label:"自物件のUSPが明確でない" },
    { id:"market_position",  label:"市場での立ち位置を整理したい" },
  ]},
  { id:"team", label:"チーム・育成", icon:"育", sub:[
    { id:"member_growth", label:"メンバーのスキルが伸びない" },
    { id:"motivation",    label:"チームのモチベーション管理" },
    { id:"process",       label:"営業プロセスの標準化" },
  ]},
];

const buildSystem = (cat, sub, docText, userName) => {
  const isTeam = cat?.id === "team";
  const callName = userName?.trim() ? userName.trim() + "さん" : "";
  const nameRef = callName
    ? `「${callName}」`
    : "名前なし（「あなた」とも呼ばない。自然に話す）";
  return `あなたはマンション新築分譲の販売事務所スタッフの思考を整理する対話エージェントです。
相手が自分の力で答えにたどり着くことを支援します。答えを与えるのではなく、気づきを引き出す役割です。

## 基本ルール
- 問いかけは1ターンに1問のみ。
- 返答は簡潔に。1〜3文を基本とする。
- 相手の名前：${nameRef}。自然なタイミングで使う（毎回は使わない）。
- 丁寧だが堅すぎず、伴走者として自然なトーンで話す。

## 会話のフェーズ設計
### PHASE1｜現状把握（2〜3往復）
事実・数字・期間を引き出す。teamテーマ以外では市場・競合の把握状況も確認。

### PHASE2｜課題と原因の深掘り
「なぜそうなっているか」を掘り下げる。表面的な答えで止まらせない。
ソクラテス式（なぜ？）とコーチング式（状況→課題→原因）を使い分ける。

### PHASE3｜解決策と根拠を引き出す
「では何ができると思いますか？」「なぜそれが効くと思いますか？」と相手に語らせる。
${!isTeam ? "競合との比較・市場ポジショニングの観点も引き出す。USPはスペック訴求ではなくエリア・タイミング固有の根拠まで深める。" : ""}

### PHASE4｜収束・整理への誘導
課題・原因・解決策が出揃ったと判断したら自分から整理を提案する：
「ここまでの話を聞いていると、〇〇という核心が見えてきました。一度ここで考えを整理してみますか？」

## 示唆のルール
以下の状況ではヒントを与えてよい（ただし問いかけの形で。答えは出さない）：
- 本質からずれている → 「少し視点を変えると、〇〇という側面はどうでしょう？」
- 同じところをぐるぐる → 「別の角度から見ると…」と切り口を変える
- 詰まっている → 選択肢を2〜3個提示
- 重要な観点の見落とし → 「ちなみに〇〇の点はどう見ていますか？」

${docText ? `## 物件・市場参照資料
以下の資料を把握した上で対話する。相手の認識と乖離があれば問いかけで気づきを促す。
---
${docText}
---` : "## 参照資料\nなし。対話の中から情報を引き出す。"}

## 今日のテーマ
${cat?.label} ／ ${sub?.label}

## セッション開始
${callName ? `「${callName}、今日は〈${sub?.label}〉について一緒に考えていきましょう。」` : `「今日は〈${sub?.label}〉について一緒に考えていきましょう。」`}と添えてから、PHASE1の現状把握の問いを1つだけ投げる。`;
};

// ── GAS API呼び出し（リトライ付き）──
const sleep = ms => new Promise(r => setTimeout(r, ms));

const gasCall = async (action, params, retries = 2) => {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action, ...params }),
      });
      // 503/429はリトライ対象
      if (res.status === 503 || res.status === 429) {
        if (attempt < retries) {
          await sleep(2000 * (attempt + 1));
          continue;
        }
        throw new Error(`サーバーが混雑しています（${res.status}）。少し時間をおいて再送信してください。`);
      }
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "GASエラー");
      return data;
    } catch(e) {
      if (attempt < retries && e.name !== "TypeError") {
        await sleep(2000 * (attempt + 1));
        continue;
      }
      throw e;
    }
  }
};

// ── UIコンポーネント ──
const RichText = ({ text }) => (
  <div style={{ fontSize:"14px", lineHeight:"1.85", color:T.text }}>
    {text.split("\n").map((line, i) => {
      if (!line.trim()) return <div key={i} style={{ height:"5px" }} />;
      const parts = line.split(/(\*\*.*?\*\*)/);
      return (
        <p key={i} style={{ margin:"2px 0" }}>
          {parts.map((p, j) =>
            p.startsWith("**")
              ? <strong key={j} style={{ color:T.gold, fontWeight:"600" }}>{p.replace(/\*\*/g,"")}</strong>
              : p
          )}
        </p>
      );
    })}
  </div>
);

const GoldDivider = () => (
  <div style={{ display:"flex", alignItems:"center", gap:"12px", margin:"20px 0" }}>
    <div style={{ flex:1, height:"1px", background:`linear-gradient(to right, transparent, ${T.border})` }} />
    <div style={{ width:"4px", height:"4px", background:T.goldDim, transform:"rotate(45deg)" }} />
    <div style={{ flex:1, height:"1px", background:`linear-gradient(to left, transparent, ${T.border})` }} />
  </div>
);

const Logo = () => (
  <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"28px" }}>
    <div style={{ position:"relative", width:"22px", height:"22px", flexShrink:0 }}>
      <div style={{ position:"absolute", inset:0, border:`1px solid ${T.gold}`, transform:"rotate(45deg)" }} />
      <div style={{ position:"absolute", top:"50%", left:"50%", transform:"translate(-50%,-50%)", width:"5px", height:"5px", background:T.gold }} />
    </div>
    <div>
      <div style={{ color:T.gold, fontSize:"13px", fontWeight:"700", letterSpacing:"0.3em" }}>MICHISHIRUBE</div>
      <div style={{ color:T.textMuted, fontSize:"9px", letterSpacing:"0.15em", marginTop:"1px" }}>道しるべ</div>
    </div>
  </div>
);

const Page = ({ children, scrollable }) => (
  <div style={{ minHeight:"100dvh", background:T.bg, display:"flex",
    alignItems: scrollable ? "flex-start" : "center", justifyContent:"center",
    padding:"32px 20px", overflowY: scrollable ? "auto" : "visible" }}>
    {children}
  </div>
);

const GoldBtn = ({ children, onClick, disabled, style }) => (
  <button onClick={onClick} disabled={disabled} style={{
    width:"100%", padding:"15px 20px",
    background: disabled ? T.surfaceHi : `linear-gradient(135deg, ${T.goldDim}, ${T.gold})`,
    border:"none", borderRadius:"10px",
    color: disabled ? T.textMuted : "#ffffff",
    fontSize:"14px", fontWeight:"700", cursor: disabled ? "not-allowed" : "pointer",
    letterSpacing:"0.04em",
    boxShadow: disabled ? "none" : "0 4px 16px rgba(184,148,63,0.30)",
    ...(style || {})
  }}>{children}</button>
);

const GhostBtn = ({ children, onClick, style }) => (
  <button onClick={onClick} style={{
    padding:"12px 18px", background:"transparent",
    border:`1px solid ${T.border}`, borderRadius:"8px",
    color:T.textSub, fontSize:"13px", cursor:"pointer", ...(style||{})
  }}>{children}</button>
);

const ErrorBox = ({ msg }) => msg ? (
  <div style={{ background:"#fff5f5", border:"1px solid #f0b0b0", borderRadius:"8px",
    padding:"10px 14px", color:"#c0392b", fontSize:"13px", marginBottom:"14px" }}>
    ⚠️ {msg}
  </div>
) : null;

// ── メインApp ──
function App() {
  const [phase, setPhase] = useState("setup"); // setup|name|theme|doc|loading|chat|summary
  const [gasUrl,   setGasUrl]   = useState(GAS_URL);
  const [userName, setUserName] = useState("");
  const [propCode, setPropCode] = useState("");
  const [propName, setPropName] = useState("");
  const [folderId, setFolderId] = useState("");
  const [docText,  setDocText]  = useState("");
  const [cat, setCat] = useState(null);
  const [sub, setSub] = useState(null);
  const [msgs,  setMsgs]  = useState([]);
  const [input, setInput] = useState("");
  const [loading,      setLoading]      = useState(false);
  const [awaitConfirm, setAwaitConfirm] = useState(false);
  const [summary, setSummary] = useState(null);
  const [error,   setError]   = useState("");
  const [sessionId, setSessionId] = useState("");
  const bottomRef = useRef(null);
  const inputRef  = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior:"smooth" });
  }, [msgs, loading]);

  const system = buildSystem(cat, sub, docText, userName);

  // セッションID生成
  const genSessionId = () => {
    const d = new Date();
    const pad = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}_${sub?.label||""}`;
  };

  // 物件フォルダ読み取り
  const loadPropertyDoc = async () => {
    if (!propCode.trim()) { setPhase("theme"); return; }
    setLoading(true); setError("");
    try {
      const res = await gasCall("getPropertyDoc", { propertyCode: propCode.trim() });
      setPropName(res.propertyName);
      setFolderId(res.folderId);
      setDocText(res.docText);
    } catch(e) {
      setError(`物件フォルダの読み取りに失敗しました：${e.message}`);
      setDocText("");
    }
    setLoading(false);
    setPhase("theme");
  };

  // セッション開始
  const startSession = async () => {
    const sid = genSessionId();
    setSessionId(sid);
    setPhase("chat"); setLoading(true); setError("");
    try {
      const res = await gasCall("chat", {
        messages: [{ role:"user", content:"セッションを開始してください。" }],
        systemPrompt: system,
        folderId, sessionId: sid,
      });
      setMsgs([{ role:"assistant", content:res.reply }]);
    } catch(e) {
      setError("セッション開始に失敗しました：" + e.message);
      setPhase("doc");
    }
    setLoading(false);
  };

  // メッセージ送信
  const send = async (text) => {
    if (!text.trim() || loading) return;
    const next = [...msgs, { role:"user", content:text }];
    setMsgs(next); setInput(""); setLoading(true); setAwaitConfirm(false);
    try {
      const res = await gasCall("chat", {
        messages: next,
        systemPrompt: system,
        folderId, sessionId,
      });
      const reply = res.reply;
      const isConfirm = ["整理してみますか","まとめてみますか","振り返ってみますか"].some(p => reply.includes(p));
      setMsgs([...next, { role:"assistant", content:reply }]);
      if (isConfirm) setAwaitConfirm(true);
    } catch(e) {
      // エラー時は会話テキストをユーザーが手動で保持できるようメッセージ改善
      setMsgs([...next, { role:"assistant", content:`⚠️ 通信エラーが発生しました。\n${e.message}\n\n入力内容は画面上に残っています。少し時間をおいてから再度送信してください。` }]);
    }
    setLoading(false);
  };

  // 整理出力
  const doSummary = async () => {
    setAwaitConfirm(false); setLoading(true);
    try {
      const res = await gasCall("saveSummary", {
        messages: msgs,
        folderId, sessionId,
        categoryId:    cat?.id,
        categoryLabel: cat?.label,
        subLabel:      sub?.label,
        userName,
      });
      setSummary(res.summary);
      setPhase("summary");
    } catch(e) {
      setMsgs(prev => [...prev, {
        role:"assistant",
        content:`⚠️ 整理の生成に失敗しました。もう一度「整理してください」とお伝えください。\n（${e.message}）`
      }]);
    }
    setLoading(false);
  };

  const reset = () => {
    setPhase("name"); setCat(null); setSub(null);
    setDocText(""); setPropCode(""); setPropName(""); setFolderId("");
    setMsgs([]); setInput(""); setSummary(null);
    setAwaitConfirm(false); setError(""); setSessionId("");
  };

  // ── SETUP（GAS URL確認）──
  if (phase === "setup") return (
    <Page>
      <div style={{ maxWidth:"440px", width:"100%" }}>
        <Logo />
        <p style={{ color:T.goldDim, fontSize:"11px", letterSpacing:"0.2em", marginBottom:"8px" }}>SETUP</p>
        <h1 style={{ color:T.text, fontSize:"22px", fontWeight:"300", lineHeight:"1.5", margin:"0 0 10px" }}>
          GAS エンドポイントの確認
        </h1>
        <p style={{ color:T.textSub, fontSize:"13px", lineHeight:"1.8", margin:"0 0 4px" }}>
          GASをデプロイしたURLを貼り付けてください。<br />
          <span style={{ color:T.textMuted }}>（初回設定後はこの画面はスキップできます）</span>
        </p>
        <GoldDivider />
        <input
          type="text"
          value={gasUrl}
          onChange={e => setGasUrl(e.target.value)}
          placeholder="https://script.google.com/macros/s/.../exec"
          style={{ width:"100%", padding:"12px 14px", background:T.surface,
            border:`1px solid ${T.border}`, borderRadius:"8px", color:T.text,
            fontSize:"12px", outline:"none", marginBottom:"16px", fontFamily:"monospace" }}
        />
        <GoldBtn disabled={!gasUrl.trim()} onClick={() => setPhase("name")}>次へ　→</GoldBtn>
      </div>
    </Page>
  );

  // ── 名前入力 ──
  if (phase === "name") return (
    <Page>
      <div style={{ maxWidth:"420px", width:"100%" }}>
        <Logo />
        <p style={{ color:T.goldDim, fontSize:"11px", letterSpacing:"0.2em", marginBottom:"8px" }}>WELCOME</p>
        <h1 style={{ color:T.text, fontSize:"24px", fontWeight:"300", lineHeight:"1.5", margin:"0 0 10px" }}>
          あなたのお名前を<br />教えてください
        </h1>
        <p style={{ color:T.textSub, fontSize:"13px", lineHeight:"1.8", margin:"0 0 4px" }}>
          セッション中にお名前でお呼びします。
        </p>
        <GoldDivider />
        <input
          type="text" value={userName}
          onChange={e => setUserName(e.target.value)}
          onKeyDown={e => { if (e.key==="Enter" && userName.trim()) setPhase("prop"); }}
          placeholder="例：田中"
          style={{ width:"100%", padding:"14px 16px", background:T.surface,
            border:`1px solid ${T.border}`, borderRadius:"8px", color:T.text,
            fontSize:"16px", outline:"none", marginBottom:"16px" }}
          autoFocus
        />
        <GoldBtn disabled={!userName.trim()} onClick={() => setPhase("prop")}>次へ　→</GoldBtn>
        <button onClick={() => { setUserName(""); setPhase("prop"); }}
          style={{ width:"100%", marginTop:"10px", padding:"12px", background:"transparent",
            border:`1px solid ${T.border}`, borderRadius:"8px",
            color:T.textMuted, fontSize:"13px", cursor:"pointer" }}>
          名前を入力せずに進む
        </button>
      </div>
    </Page>
  );

  // ── 物件コード入力 ──
  if (phase === "prop") return (
    <Page>
      <div style={{ maxWidth:"420px", width:"100%" }}>
        <Logo />
        <p style={{ color:T.goldDim, fontSize:"11px", letterSpacing:"0.2em", marginBottom:"8px" }}>PROPERTY</p>
        <h1 style={{ color:T.text, fontSize:"22px", fontWeight:"300", lineHeight:"1.5", margin:"0 0 10px" }}>
          物件コードを入力
        </h1>
        <p style={{ color:T.textSub, fontSize:"13px", lineHeight:"1.8", margin:"0 0 4px" }}>
          6桁の物件コードを入力してください。<br />
          DriveのフォルダからUSP資料・競合情報を自動で読み込みます。
          <br /><span style={{ color:T.textMuted }}>※ スキップするとテーマ選択のみで進みます</span>
        </p>
        <ErrorBox msg={error} />
        <GoldDivider />
        <input
          type="text" value={propCode}
          onChange={e => setPropCode(e.target.value)}
          onKeyDown={e => { if (e.key==="Enter") loadPropertyDoc(); }}
          placeholder="例：012345"
          maxLength={6}
          style={{ width:"100%", padding:"14px 16px", background:T.surface,
            border:`1px solid ${T.border}`, borderRadius:"8px", color:T.text,
            fontSize:"20px", outline:"none", marginBottom:"16px",
            letterSpacing:"0.3em", textAlign:"center", fontWeight:"600" }}
          autoFocus
        />
        <GoldBtn onClick={loadPropertyDoc}>
          {loading ? "読み込み中..." : "物件情報を読み込む　→"}
        </GoldBtn>
        <button onClick={() => { setPropCode(""); setPhase("theme"); }}
          style={{ width:"100%", marginTop:"10px", padding:"12px", background:"transparent",
            border:`1px solid ${T.border}`, borderRadius:"8px",
            color:T.textMuted, fontSize:"13px", cursor:"pointer" }}>
          スキップしてテーマ選択へ
        </button>
      </div>
    </Page>
  );

  // ── テーマ選択 ──
  if (phase === "theme") return (
    <Page scrollable={true}>
      <div style={{ maxWidth:"560px", width:"100%", paddingTop:"8px" }}>
        <Logo />
        {propName && (
          <div style={{ background:T.goldGlow, border:`1px solid ${T.border}`, borderRadius:"8px",
            padding:"10px 14px", marginBottom:"16px", display:"flex", alignItems:"center", gap:"8px" }}>
            <span style={{ color:T.gold, fontSize:"12px" }}>◆</span>
            <span style={{ color:T.textSub, fontSize:"13px" }}>{propName}</span>
          </div>
        )}
        <p style={{ color:T.goldDim, fontSize:"11px", letterSpacing:"0.2em", marginBottom:"8px" }}>THINK TOGETHER</p>
        <h1 style={{ color:T.text, fontSize:"24px", fontWeight:"300", lineHeight:"1.5", margin:"0 0 4px" }}>
          {userName.trim() ? `${userName.trim()}さん、` : ""}今日は何について<br />考えますか？
        </h1>
        <GoldDivider />
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px", marginBottom:"8px" }}>
          {CATEGORIES.map(c => (
            <button key={c.id} onClick={() => { setCat(c); setSub(null); }} style={{
              background: cat?.id===c.id ? T.goldGlow : T.surface,
              border:`1px solid ${cat?.id===c.id ? T.goldDim : T.border}`,
              borderRadius:"10px", padding:"18px 14px", cursor:"pointer",
              display:"flex", flexDirection:"column", alignItems:"center", gap:"10px",
            }}>
              <div style={{ width:"38px", height:"38px", borderRadius:"50%",
                background: cat?.id===c.id ? T.gold : T.surfaceHi,
                display:"flex", alignItems:"center", justifyContent:"center",
                color: cat?.id===c.id ? "#fff" : T.textSub,
                fontSize:"12px", fontWeight:"700", letterSpacing:"0.05em" }}>{c.icon}</div>
              <span style={{ fontSize:"13px", fontWeight:"600",
                color: cat?.id===c.id ? T.goldDim : T.text }}>{c.label}</span>
            </button>
          ))}
        </div>
        {cat && (
          <div style={{ animation:"fadeIn 0.2s ease" }}>
            <GoldDivider />
            <p style={{ color:T.textSub, fontSize:"13px", marginBottom:"14px" }}>具体的なテーマを選んでください</p>
            <div style={{ display:"flex", flexDirection:"column", gap:"8px", marginBottom:"24px" }}>
              {cat.sub.map(s => (
                <button key={s.id} onClick={() => setSub(s.id===sub?.id ? null : s)} style={{
                  background: sub?.id===s.id ? T.goldGlow : T.surface,
                  border:`1px solid ${sub?.id===s.id ? T.goldDim : T.borderSub}`,
                  borderRadius:"8px", padding:"14px 16px", cursor:"pointer",
                  textAlign:"left", color: sub?.id===s.id ? T.text : T.textSub,
                  fontSize:"14px", display:"flex", alignItems:"center", gap:"10px",
                }}>
                  <span style={{ color: sub?.id===s.id ? T.gold : T.textMuted, fontSize:"10px" }}>
                    {sub?.id===s.id ? "◆" : "◇"}
                  </span>
                  {s.label}
                </button>
              ))}
            </div>
          </div>
        )}
        {sub && <GoldBtn onClick={startSession}>セッションを開始する　→</GoldBtn>}
      </div>
    </Page>
  );

  // ── チャット ──
  if (phase === "chat") return (
    <div style={{ height:"100dvh", display:"flex", flexDirection:"column", background:T.bg }}>
      <div style={{ background:T.surface, borderBottom:`1px solid ${T.border}`,
        padding:"12px 16px", display:"flex", alignItems:"center", gap:"12px",
        flexShrink:0, boxShadow:"0 1px 4px rgba(0,0,0,0.06)" }}>
        <button onClick={reset} style={{ background:"transparent", border:`1px solid ${T.border}`,
          borderRadius:"6px", padding:"6px 12px", color:T.textSub, fontSize:"12px", cursor:"pointer" }}>
          終了
        </button>
        <div style={{ flex:1, textAlign:"center" }}>
          <div style={{ color:T.goldDim, fontSize:"10px", letterSpacing:"0.15em", marginBottom:"2px" }}>
            {propName || cat?.label}
          </div>
          <div style={{ color:T.text, fontSize:"13px", fontWeight:"600" }}>{sub?.label}</div>
          {userName.trim() && <div style={{ color:T.textMuted, fontSize:"11px", marginTop:"1px" }}>{userName}さん</div>}
        </div>
        <div style={{ width:"52px", textAlign:"right" }}>
          {folderId && <span style={{ color:T.gold, fontSize:"10px" }}>●保存中</span>}
        </div>
      </div>

      <div style={{ flex:1, overflowY:"auto", padding:"20px 16px",
        display:"flex", flexDirection:"column", gap:"18px",
        WebkitOverflowScrolling:"touch", background:"#f5f2ec" }}>
        {msgs.map((m, i) => (
          <div key={i} style={{ display:"flex",
            justifyContent: m.role==="user" ? "flex-end" : "flex-start",
            gap:"10px", animation:"fadeIn 0.2s ease" }}>
            {m.role==="assistant" && (
              <div style={{ width:"32px", height:"32px", borderRadius:"50%",
                background:`linear-gradient(135deg,${T.goldDim},${T.gold})`,
                display:"flex", alignItems:"center", justifyContent:"center",
                flexShrink:0, marginTop:"2px" }}>
                <span style={{ color:"#fff", fontSize:"10px", fontWeight:"700" }}>AI</span>
              </div>
            )}
            <div style={ m.role==="user" ? {
              maxWidth:"82%", background:T.surface, border:`1px solid ${T.border}`,
              borderRadius:"14px 4px 14px 14px", padding:"12px 16px",
              boxShadow:"0 1px 4px rgba(0,0,0,0.06)",
            } : {
              maxWidth:"82%", background:T.surface, borderLeft:`2px solid ${T.gold}`,
              borderRadius:"2px 12px 12px 2px", padding:"12px 16px",
              boxShadow:"0 1px 4px rgba(0,0,0,0.06)",
            }}>
              <RichText text={m.content} />
            </div>
          </div>
        ))}

        {awaitConfirm && !loading && (
          <div style={{ paddingLeft:"42px", display:"flex", flexDirection:"column",
            gap:"8px", animation:"fadeIn 0.2s ease" }}>
            <div style={{ color:T.textMuted, fontSize:"11px", letterSpacing:"0.1em", marginBottom:"2px" }}>
              — ご選択ください —
            </div>
            <div style={{ display:"flex", gap:"8px", flexWrap:"wrap" }}>
              <button onClick={doSummary} style={{ padding:"10px 16px",
                background:T.goldGlow, border:`1px solid ${T.gold}`,
                borderRadius:"8px", color:T.goldDim, fontSize:"13px",
                fontWeight:"600", cursor:"pointer" }}>
                ✦ はい、整理してください
              </button>
              <button onClick={() => { setAwaitConfirm(false); send("まだ話したいことがあります。続けてください。"); }}
                style={{ padding:"10px 16px", background:"transparent",
                  border:`1px solid ${T.border}`, borderRadius:"8px",
                  color:T.textSub, fontSize:"13px", cursor:"pointer" }}>
                もう少し続ける
              </button>
            </div>
          </div>
        )}

        {loading && (
          <div style={{ display:"flex", gap:"10px", alignItems:"flex-start" }}>
            <div style={{ width:"32px", height:"32px", borderRadius:"50%",
              background:`linear-gradient(135deg,${T.goldDim},${T.gold})`,
              display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
              <span style={{ color:"#fff", fontSize:"10px", fontWeight:"700" }}>AI</span>
            </div>
            <div style={{ background:T.surface, borderLeft:`2px solid ${T.gold}`,
              borderRadius:"2px 12px 12px 2px", padding:"14px 18px",
              boxShadow:"0 1px 4px rgba(0,0,0,0.06)" }}>
              <div style={{ display:"flex", gap:"5px", alignItems:"center" }}>
                {[0,0.2,0.4].map((d,i) => (
                  <div key={i} style={{ width:"7px", height:"7px", borderRadius:"50%",
                    background:T.gold, animation:`glow 1.2s ease-in-out ${d}s infinite` }} />
                ))}
              </div>
            </div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>

      <div style={{ borderTop:`1px solid ${T.border}`, padding:"12px 16px",
        background:T.surface, flexShrink:0, boxShadow:"0 -1px 4px rgba(0,0,0,0.04)" }}>
        <div style={{ display:"flex", gap:"8px", alignItems:"flex-end" }}>
          <textarea
            ref={inputRef}
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(input);} }}
            placeholder="考えを入力してください"
            rows={2} disabled={loading}
            style={{ flex:1, padding:"12px 14px", background:T.surfaceHi,
              border:`1px solid ${T.border}`, borderRadius:"10px", color:T.text,
              fontSize:"14px", resize:"none", outline:"none", lineHeight:"1.6" }}
          />
          <button onClick={() => send(input)} disabled={!input.trim()||loading}
            style={{ padding:"12px 18px",
              background: input.trim()&&!loading ? `linear-gradient(135deg,${T.goldDim},${T.gold})` : T.surfaceHi,
              border:"none", borderRadius:"10px",
              color: input.trim()&&!loading ? "#fff" : T.textMuted,
              fontSize:"14px", fontWeight:"700",
              cursor: input.trim()&&!loading ? "pointer" : "not-allowed", flexShrink:0 }}>
            送信
          </button>
        </div>
      </div>
    </div>
  );

  // ── サマリー ──
  if (phase === "summary" && summary) {
    const isTeam = cat?.id === "team";
    const blocks = [
      { key:"situation", label:"現状",   color:"#8a7040", bg:"#fdf9f2" },
      { key:"issues",    label:"課題",   color:"#8a3a3a", bg:"#fdf4f4" },
      { key:"causes",    label:"原因",   color:"#3a4a8a", bg:"#f4f6fd" },
      { key:"solutions", label:"解決策", color:"#2a6a4a", bg:"#f2fdf7" },
      { key:"rationale", label:"根拠",   color:"#4a5a2a", bg:"#f6fdf2" },
    ];
    return (
      <Page scrollable={true}>
        <div style={{ maxWidth:"640px", width:"100%", paddingTop:"8px" }}>
          <Logo />
          <p style={{ color:T.goldDim, fontSize:"11px", letterSpacing:"0.2em", marginBottom:"6px" }}>SESSION SUMMARY</p>
          <h1 style={{ color:T.text, fontSize:"20px", fontWeight:"300", margin:"0 0 4px" }}>{sub?.label}</h1>
          <p style={{ color:T.textMuted, fontSize:"12px", marginBottom:"0" }}>
            {propName || cat?.label}{userName.trim() ? `　／　${userName}さん` : ""}
          </p>
          {folderId && (
            <p style={{ color:T.gold, fontSize:"11px", marginTop:"4px" }}>
              ✓ Driveに保存されました
            </p>
          )}
          <GoldDivider />

          {blocks.map(({ key, label, color, bg }) => {
            const val = summary[key];
            if (!val || (Array.isArray(val) && val.length===0)) return null;
            const items = Array.isArray(val) ? val : [val];
            return (
              <div key={key} style={{ marginBottom:"14px", background:bg,
                borderRadius:"10px", padding:"14px 16px",
                border:`1px solid ${T.borderSub}`, animation:"fadeIn 0.3s ease" }}>
                <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"10px" }}>
                  <div style={{ width:"3px", height:"16px", background:color, borderRadius:"2px", flexShrink:0 }} />
                  <span style={{ color, fontSize:"11px", fontWeight:"700", letterSpacing:"0.15em" }}>{label}</span>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:"6px" }}>
                  {items.map((item, i) => (
                    <div key={i} style={{ display:"flex", gap:"8px", color:T.text, fontSize:"14px", lineHeight:"1.8" }}>
                      {items.length>1 && <span style={{ color, flexShrink:0, marginTop:"3px", fontSize:"10px" }}>◆</span>}
                      <span>{item}</span>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}

          {!isTeam && summary.positioning && (
            <>
              <GoldDivider />
              <div style={{ background:"linear-gradient(135deg,#fffbf0,#fdf6e3)",
                border:`1.5px solid ${T.gold}`, borderRadius:"10px",
                padding:"20px", marginBottom:"8px", animation:"fadeIn 0.3s ease" }}>
                <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"12px" }}>
                  <span style={{ color:T.gold, fontSize:"14px" }}>✦</span>
                  <span style={{ color:T.goldDim, fontSize:"11px", fontWeight:"700", letterSpacing:"0.15em" }}>
                    競合優位ポジショニング（USP）
                  </span>
                </div>
                <p style={{ color:T.text, fontSize:"14px", lineHeight:"1.9", margin:0, fontWeight:"500" }}>
                  {summary.positioning}
                </p>
              </div>
            </>
          )}

          {summary.ai_comment && (
            <>
              <GoldDivider />
              <div style={{ background:"#f8f5ff", border:"1px solid #c4b0e8",
                borderRadius:"10px", padding:"20px", marginBottom:"8px", animation:"fadeIn 0.4s ease" }}>
                <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"12px" }}>
                  <div style={{ width:"28px", height:"28px", borderRadius:"50%",
                    background:"#7c5cbf", display:"flex", alignItems:"center",
                    justifyContent:"center", flexShrink:0 }}>
                    <span style={{ color:"#fff", fontSize:"10px", fontWeight:"700" }}>AI</span>
                  </div>
                  <span style={{ color:"#5a3fa0", fontSize:"11px", fontWeight:"700", letterSpacing:"0.1em" }}>
                    今日の会話を通じて感じたこと
                  </span>
                </div>
                <p style={{ color:"#3a2a60", fontSize:"14px", lineHeight:"1.9", margin:0 }}>
                  {summary.ai_comment}
                </p>
              </div>
            </>
          )}

          <GoldDivider />
          <div style={{ display:"flex", gap:"10px", paddingBottom:"32px" }}>
            <GhostBtn onClick={() => setPhase("chat")}>← 戻る</GhostBtn>
            <GoldBtn onClick={reset} style={{ flex:1 }}>新しいセッション</GoldBtn>
          </div>
        </div>
      </Page>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
